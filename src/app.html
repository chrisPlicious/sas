		<!-- Motion gates, decided before first paint so nothing flashes.
		     Entry loader: once per browser session; ?intro forces a replay.
		     Section reveals: only with JS + motion allowed.
		     Reduced motion skips both. Timeouts release the page if the app bundle never runs. -->
		<script>
			(function () {
				try {
					var root = document.documentElement;
					var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
					var force = /[?&]intro\b/.test(location.search);
					var seen = sessionStorage.getItem('sas-intro-seen');
					if (force || (!seen && !calm)) {
						root.classList.add('sas-intro');
						setTimeout(function () {
							root.classList.remove('sas-intro');
						}, 15000);
					}
					if (!calm && 'IntersectionObserver' in window) {
						root.classList.add('reveal-ready');
						setTimeout(function () {
							if (!window.__sasReveal) root.classList.remove('reveal-ready');
						}, 5000);
					}
				} catch (e) {}
			})();
		</script>
